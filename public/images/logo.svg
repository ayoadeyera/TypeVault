<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Keycap Body -->
    <linearGradient id="keycapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Keycap Bevel Gradient -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Lightning & Cursor Accent Glow -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glowing Cursor Beam -->
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Key Shadow -->
    <filter id="keyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Outer Keycap Base with 3D Depth Shadow -->
  <rect x="10" y="10" width="80" height="80" rx="20" fill="url(#keycapGrad)" stroke="url(#bevelGrad)" stroke-width="2.5" filter="url(#keyShadow)" />

  <!-- Inner Keycap Face Inset -->
  <rect x="18" y="18" width="64" height="64" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />

  <!-- Accent Corner Highlights (Keycap Depth Accent) -->
  <path d="M 22 28 A 6 6 0 0 1 28 22 L 72 22" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  
  <!-- Sleek Typing Cursor Line (Left Anchor) -->
  <line x1="32" y1="31" x2="32" y2="69" stroke="url(#cursorGrad)" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)" />
  
  <!-- Modern Lightning Bolt Symbol (Intertwined with Cursor) -->
  <polygon points="56,26 40,50 51,50 44,74 65,46 54,46" fill="url(#boltGrad)" filter="url(#neonGlow)" />

  <!-- Dynamic Typing Sparkles / Accents -->
  <circle cx="68" cy="31" r="2.2" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="34" cy="74" r="1.8" fill="#a855f7" filter="url(#neonGlow)" />
</svg>
